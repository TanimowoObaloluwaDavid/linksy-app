name: linksy
description: >-
  Linksy — sharing-first file transfer. Select files, create a secure share,
  let another person open it through a link or QR code.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Domain value equality (models are hand-written; see README "Codegen decision")
  equatable: ^2.0.7

  # Local persistence (theme + session preferences only)
  shared_preferences: ^2.3.2

  # Files
  file_picker: ^8.1.4

  # QR: generate + scan
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0

  # Share sheet + browser launch
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Motion
  flutter_animate: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # Display / brand — Space Grotesk (OFL 1.1)
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    # UI / body — Inter (OFL 1.1)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Technical data — JetBrains Mono (OFL 1.1)
    # Filenames, sizes, share IDs, checksums and URLs are monospace because
    # they are literal machine values, not prose.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700