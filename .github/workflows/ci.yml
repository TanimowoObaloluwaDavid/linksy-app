name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: analyze & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

      - name: Render screens (visual smoke test)
        # Fails if any screen throws during layout. The PNGs are written with
        # --update-goldens so the run also produces fresh captures as artifacts.
        run: flutter test test/screenshot_harness.dart --update-goldens

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screenshots/*.png
          retention-days: 7
          if-no-files-found: error

  build:
    name: build web
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release